# No backend needed: the build never calls Spring; API_BASE_URL is read at request time.
name: Frontend build

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-build.yml"
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-build.yml"

permissions:
  contents: read

concurrency:
  group: frontend-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Typecheck, lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # ci, not install: fails if package-lock.json and package.json disagree.
      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # Also runs scripts/check-design-tokens.mjs.
      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
