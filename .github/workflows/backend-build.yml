# Continuous build: the backend compiles and packages into a runnable jar.
# Fast feedback — tests run separately in backend-test.yml.
name: Backend build

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-build.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-build.yml"

permissions:
  contents: read

# A newer push to the same branch cancels the run it makes obsolete.
concurrency:
  group: backend-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compile and package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # -DskipTests still compiles the test sources, so a broken test file
      # fails the build here too.
      - name: Build
        run: ./mvnw -B -ntp clean package -DskipTests
