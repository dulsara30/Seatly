spring:
  application:
    name: seatly

  # Imports a local .env as properties; optional because CI and prod use real env vars.
  config:
    import: optional:file:.env[.properties]

  datasource:
    url: jdbc:postgresql://localhost:5433/seatly
    username: seatly
    password: seatly

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
    show-sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  threads:
    virtual:
      enabled: true

  # Users come from the DB via JWT; this stops Boot creating and logging an unused default user.
  autoconfigure:
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

seatly:
  jwt:
    # From JWT_SIGNING_KEY (Base64, >= 32 bytes). No default on purpose: a missing key stops startup.
    signing-key: ${JWT_SIGNING_KEY}
    access-token-ttl: 1h

server:
  port: 8080

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

logging:
  level:
    org.hibernate.SQL: debug
