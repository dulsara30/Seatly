services:
  postgres:
    image: postgres:16-alpine
    container_name: seatly-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: seatly
      POSTGRES_USER: seatly
      POSTGRES_PASSWORD: seatly
    ports:
      - "5433:5432"
    volumes:
      - seatly-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seatly -d seatly"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  seatly-pgdata:
